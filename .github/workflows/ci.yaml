name: CI de test pour le Back
on: [push]

env:
    APP_SECRET: CI
    DEFAULT_URI: ${{secrets.DATABASE_URI}}
    DATABASE_URL: ${{secrets.DATABASE_URL}}

jobs:
    install:
        runs-on: ubuntu-latest
        steps:
            - name: create env file
              run: |
                  touch .env

            - name: Checkout code
              uses: actions/checkout@v6

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: pdo_mysql

            - name: Dependances
              run: composer install

            - name: Mise en cache
              uses: actions/cache@v5
              with:
                  path: |
                      vendor
                      assets/vendor
                  key: deps-${{ hashFiles('composer.lock', 'importmap.php') }}

    lint:
        needs: install
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: pdo_mysql

            - name: Recuperation du cache
              uses: actions/cache/restore@v5
              with:
                  path: |
                      vendor
                      assets/vendor
                  key: deps-${{ hashFiles('composer.lock', 'importmap.php') }}

            - name: Lint du YAML
              run: php bin/console lint:yaml config

            - name: Lint des templates Twig
              run: php bin/console lint:twig templates

            - name: Lint de la config des services et du typage
              run: php bin/console lint:container

    phpstan:
        needs: install
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: pdo_mysql

            - name: Recuperation du cache
              uses: actions/cache/restore@v5
              with:
                  path: |
                      vendor
                      assets/vendor
                  key: deps-${{ hashFiles('composer.lock', 'importmap.php') }}

            - name: PHPStan
              run: vendor/bin/phpstan analyse

    cs-fixer:
        needs: install
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: pdo_mysql

            - name: Recuperation du cache
              uses: actions/cache/restore@v5
              with:
                  path: |
                      vendor
                      assets/vendor
                  key: deps-${{ hashFiles('composer.lock', 'importmap.php') }}

            - name: PHP CS Fixer
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

    test:
        needs: [lint, phpstan, cs-fixer]
        runs-on: ubuntu-latest
        services:
            db:
                image: mariadb:10.6
                env:
                    MYSQL_ROOT_PASSWORD: ${{secrets.MYSQL_ROOT_PASSWORD}}
                ports:
                    - 3306:3306

        env:
            DATABASE_URL: ${{secrets.DATABASE_URL}}

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: pdo_mysql, intl

            - name: Recuperer vendor depuis le cache
              uses: actions/cache/restore@v5
              with:
                  path: |
                      vendor
                      assets/vendor
                  key: deps-${{ hashFiles('composer.lock', 'importmap.php') }}

            - name: Creer la base de test
              run: php bin/console doctrine:database:create --if-not-exists --env=test

            - name: Faire les migrations
              run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

            - name: Charger les donnees de test merci
              run: mysql -h 127.0.0.1 -P 3306 -uroot -p${{secrets.MYSQL_ROOT_PASSWORD}} harmonia_test < docker/harmonia.sql

            - name: Tests
              run: php bin/phpunit
